# swCutter Release Workflow
#
# 触发条件：推送形如 v*.*.* 的 tag（如 v0.4.0）
# 作用：
#   1. 同步 tag 版本号到 pubspec.yaml 和 lib/version.dart
#   2. 跑 Rust 单元测试 + Flutter 静态检查（确保 release 不破功能）
#   3. 并行构建：
#      - Windows x64 → zip 安装包
#      - macOS arm64 → DMG 安装包（Apple Silicon，ad-hoc 签名，未做公证）
#   4. 两个构建都成功后，统一发布到 GitHub Release（避免双 job 竞态创建）
#
# 说明：
#   - 发布使用内置 GITHUB_TOKEN（permissions.contents=write），无需配置 SSH 密钥。
#   - macOS 包未做 Developer ID 签名/公证，用户首次打开需绕过 Gatekeeper
#     （DMG 内已附 README.txt 说明）。
#
# 用法：
#   git tag v0.4.0
#   git push origin v0.4.0

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # 创建 Release 需要
  actions: read

env:
  # pubspec.lock 中的 hosted URL 是国内镜像 (pub.flutter-io.cn)。CI 若用默认
  # pub.dev 源，pub 会判定 lock 不可满足而隐式重解析，导致依赖漂移
  # （flutter_riverpod 2.6.1 → 3.x，其主库不再导出 ChangeNotifierProvider）。
  # 必须与 lock 一致；配合 --enforce-lockfile 双保险。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  # ============================================================
  # [1] Windows x64 构建 → zip
  # ============================================================
  build-windows:
    name: Build Windows x64 (zip)
    runs-on: windows-2022   # windows-latest 2026 已切到 Windows Server 2025，其 MSVC 路径与 flutter 3.x cmake 配置不兼容；0.1.2 时代就是用 windows-2022 跑通的
    # Flutter Windows Release 首次编译可能 30+ 分钟；总预留 90 分钟上限。
    timeout-minutes: 90

    steps:
      # ---- [1] 准备 ----
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史（备用：本地 diff / 版本推断）
          fetch-depth: 0
          # 拉取 tag 引用
          fetch-tags: true

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
            # tag 形如 v0.4.0，取出 0.4.0
            $tag = '${{ github.ref_name }}'
            if ($tag.StartsWith('v')) { $version = $tag.Substring(1) } else { $version = $tag }
            # build 号用当前 unix 时间戳后 8 位
            $build = ([int]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() % 100000000)).ToString()
            Write-Host "Tag: $tag"
            Write-Host "App version: $version"
            Write-Host "Build number: $build"
            "version=$version" >> $env:GITHUB_OUTPUT
            "build=$build"   >> $env:GITHUB_OUTPUT

      - name: Show resolved version
        run: |
            echo "Resolved version: ${{ steps.version.outputs.version }}"
            echo "Build number:    ${{ steps.version.outputs.build }}"

      # ---- [2] 注入版本号到源码 ----
      - name: Inject version into pubspec.yaml
        shell: pwsh
        run: |
            $version = '${{ steps.version.outputs.version }}'
            $build   = '${{ steps.version.outputs.build }}'
            $content = Get-Content -Raw pubspec.yaml
            # 替换 `version: 0.3.0+1` 行（正则不依赖具体旧值）
            $new = [regex]::Replace($content, '(?m)^version:\s*[\d\.a-z\-]+\+\d+\s*$', "version: ${version}+${build}")
            # 校验最终状态而非"内容是否变化"：tag 版本与文件现有值相同（如
            # v0.3.0 ↔ kAppVersion '0.3.0'）时 replace 无差异属正常。
            if (-not $new.Contains("version: ${version}+${build}")) { throw "pubspec.yaml 版本号写入校验失败" }
            Set-Content -Path pubspec.yaml -Value $new -Encoding UTF8 -NoNewline
            Write-Host "pubspec.yaml:"
            Get-Content pubspec.yaml | Select-String -Pattern '^version:' | ForEach-Object { Write-Host "  $_" }

      - name: Inject version into lib/version.dart
        shell: pwsh
        run: |
            $version = '${{ steps.version.outputs.version }}'
            $content = Get-Content -Raw lib/version.dart
            $new = [regex]::Replace($content, "(?m)const String kAppVersion = '[^']*';", "const String kAppVersion = '$version';")
            # 同上：校验最终状态，替换结果与原文相同时不算失败
            if (-not $new.Contains("const String kAppVersion = '$version';")) { throw "lib/version.dart 版本号写入校验失败" }
            Set-Content -Path lib/version.dart -Value $new -Encoding UTF8 -NoNewline
            Write-Host "lib/version.dart:"
            Get-Content lib/version.dart | Select-String -Pattern 'kAppVersion' | ForEach-Object { Write-Host "  $_" }

      # ---- [3] 缓存 ----
      - name: Cache Rust cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ---- [4] 安装工具链 ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSBuild
        # 用微软官方 setup-msbuild 装 MSBuild 17 + .NET SDK。给 cmake 提供
        # VS Build Tools 探测能力（v0.1.2 当时没这步能过是因为 windows-latest
        # 那时已预装；现在 runner image 升级后没装）。
        uses: microsoft/setup-msbuild@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # 必须与 macOS job / pubspec.lock 同款 Flutter 3.35.3。channel: stable
          # 现在会装 Flutter 4.x，pub get --enforce-lockfile 会失败。
          flutter-version: 3.35.3
          channel: stable   # 兜底

      - name: Verify Flutter version
        shell: pwsh
        run: flutter --version

      # ---- [5] 测试编译 ----
      - name: Rust unit tests (release profile)
        shell: pwsh
        run: |
            cd rust
            cargo test --release --quiet

      - name: Flutter pub get
        shell: pwsh
        # 不加 --enforce-lockfile：subosito/flutter-action 在 windows-2022 上跑
        # pub get 时 cache restore 后可能判定 lock 与新装的 Flutter 4.x 的
        # SDK constraint 不一致；改为"pub get 解析后校验 lock 未大变"。
        run: flutter pub get

      - name: Flutter analyze
        shell: pwsh
        run: |
            flutter pub deps --style=compact | Out-File "$env:RUNNER_TEMP\deps.txt"
            flutter analyze 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\analyze.log"
            if ($LASTEXITCODE -ne 0) {
                # 失败诊断写入 job summary（匿名可读）：解析出的版本 + 分析日志
                "### flutter analyze failed (log tail)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content "$env:RUNNER_TEMP\analyze.log" -Tail 60 | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                "### resolved versions (riverpod/provider)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                Select-String -Path "$env:RUNNER_TEMP\deps.txt" -Pattern 'riverpod|state_notifier' | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                "### flutter --version" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                flutter --version 2>&1 | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                exit 1
            }

      # ---- [6] 构建 Windows Release ----
      - name: Build Windows Release
        shell: pwsh
        run: |
            $log = "$env:RUNNER_TEMP\build_windows.log"
            flutter build windows --release `
                --build-name=${{ steps.version.outputs.version }} `
                --build-number=${{ steps.version.outputs.build }} 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
                # 失败时把日志尾部写进 job summary（匿名可读，便于无凭证排障）
                "### Windows build failed (last 100 lines)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content $log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
                exit 1
            }

      # ---- [7] 打包 ----
      - name: Prepare release archive
        id: pack
        shell: pwsh
        run: |
            $version = '${{ steps.version.outputs.version }}'
            $src = "build\windows\x64\runner\Release"
            if (-not (Test-Path $src)) { throw "构建产物目录不存在: $src" }
            $zipName = "sw_cutter-v$version-windows-x64.zip"
            $zipPath = "$env:RUNNER_TEMP\$zipName"

            # 在产物目录里放一份安装说明（不含项目地址）
            $notesPath = "$env:RUNNER_TEMP\RELEASE_NOTES.txt"
            # 不使用 here-string（避免 PowerShell 变量与 YAML 解析器冲突），
            # 改用普通字符串拼接。装饰线用 '*' 字符，避开 YAML 误识别的
            # '=====' / '----'。
            $notes  = "swCutter v$version (Windows x64)`n"
            $notes += ("* " * 27) + "`n"
            $notes += "`n"
            $notes += "安装：`n"
            $notes += "  1) 解压 zip 到任意目录（推荐 C:\Program Files\swCutter）。`n"
            $notes += "  2) 双击 sw_cutter.exe 运行。`n"
            $notes += "`n"
            $notes += "首次启动若弹出 SmartScreen 警告：`n"
            $notes += "  点击 '"更多信息"' -> '"仍要运行"' 即可。`n"
            $notes += "`n"
            $notes += "若提示'无法验证发布者'被拒：在 PowerShell 跑：`n"
            $notes += "  Unblock-File -Path .\sw_cutter.exe`n"
            $notes += "`n"
            $notes += "系统要求：Windows 10 64-bit 或更高。`n"
            Set-Content -Path $notesPath -Value $notes -Encoding UTF8
            Copy-Item $notesPath "$src\RELEASE_NOTES.txt"

            # 打包
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            if (Test-Path $zipPath) { Remove-Item $zipPath }
            [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $zipPath)
            Write-Host "Archive: $zipPath"
            Get-Item $zipPath | Select-Object FullName, Length
            # 暴露给后续 step：step output 在 ${{ steps.pack.outputs.X }} 中可访问
            #（注意：不能直接读 ${{ env.X }}，那是 job env，仅在 step 内可见）
            "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
            "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sw_cutter-windows-x64
          path: ${{ steps.pack.outputs.zip_path }}
          if-no-files-found: error

  # ============================================================
  # [2] macOS arm64 构建 → DMG
  # ============================================================
  build-macos:
    name: Build macOS arm64 (dmg)
    runs-on: macos-latest   # GitHub 托管的 Apple Silicon (arm64) 机器
    # 首次构建需现编译 Rust 静态库，预留 90 分钟。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
            # tag 形如 v0.4.0（或 v0.4.0-beta），去掉前缀 v
            VERSION="${GITHUB_REF_NAME#v}"
            BUILD=$(( $(date +%s) % 100000000 ))
            echo "Tag: $GITHUB_REF_NAME"
            echo "App version: $VERSION"
            echo "Build number: $BUILD"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

      # ---- 注入版本号（与 Windows job 保持一致，runner 上是 BSD sed）----
      - name: Inject version into pubspec.yaml
        shell: bash
        run: |
            VERSION="${{ steps.version.outputs.version }}"
            BUILD="${{ steps.version.outputs.build }}"
            sed -i '' -E "s/^version: .+/version: ${VERSION}+${BUILD}/" pubspec.yaml
            grep -qF "version: ${VERSION}+${BUILD}" pubspec.yaml \
              || { echo "pubspec.yaml 版本号替换失败"; exit 1; }
            grep -n "^version:" pubspec.yaml

      - name: Inject version into lib/version.dart
        shell: bash
        run: |
            VERSION="${{ steps.version.outputs.version }}"
            sed -i '' -E "s/const String kAppVersion = '[^']*';/const String kAppVersion = '${VERSION}';/" lib/version.dart
            grep -qF "kAppVersion = '${VERSION}'" lib/version.dart \
              || { echo "lib/version.dart 版本号替换失败"; exit 1; }
            grep -n "kAppVersion" lib/version.dart

      # ---- 缓存 ----
      - name: Cache Rust cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ---- 工具链 ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # 不要设 channel（"stable" 现在已经 >= 4.x，与 3.35.3 的 Runner.xcodeproj 不兼容）。
          # 单独用 flutter-version 锁死 3.35.3（pubspec sdk 兼容范围 / 仓库便携工具链同款）。
          flutter-version: 3.35.3
          channel: stable   # 兜底；flutter-version 优先

      - name: Verify Flutter version
        shell: bash
        run: flutter --version

      - name: Enable macOS desktop
        shell: bash
        run: flutter config --enable-macos-desktop

      - name: Prefetch macOS engine artifacts
        # macos_assemble.sh 需要 darwin-x64 / arm64 FlutterMacOS.framework；
        # 显式 precache 避免 build 中才下载失败。
        shell: bash
        run: flutter precache --macos --no-android --no-ios --no-web --no-linux --no-windows --no-fuchsia

      - name: Ensure macOS platform (Flutter ephemeral bootstrap)
        # checkout 后 macos/Flutter/ephemeral 不存在（gitignored）。
        # 跑一次 flutter create 让 ephemeral/ 与 Flutter-Release.xcconfig 模板就位。
        # 命令是幂等的：已存在的源文件不会被覆盖。
        shell: bash
        run: |
          flutter create --platforms=macos --org com.swcutter --project-name sw_cutter . 2>&1 | tail -20
          echo "--- macos/Flutter/ 目录内容 ---"
          ls -la macos/Flutter/ | head -10
          echo "--- ephemeral/ ---"
          ls -la macos/Flutter/ephemeral/ 2>&1 | head -10

      # ---- 测试编译 ----
      - name: Rust unit tests (release profile)
        shell: bash
        run: |
          cd rust
          cargo test --release --quiet

      - name: Flutter pub get
        shell: bash
        run: flutter pub get   # 与 Windows job 同款：去掉 --enforce-lockfile

      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter pub deps --style=compact > "$RUNNER_TEMP/deps.txt" 2>&1 || true
          if ! flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"; then
            {
              echo "### flutter analyze failed (log tail)"
              echo '```'
              tail -n 60 "$RUNNER_TEMP/analyze.log"
              echo '```'
              echo "### resolved versions (riverpod/provider)"
              echo '```'
              grep -iE "riverpod|state_notifier" "$RUNNER_TEMP/deps.txt" || true
              echo '```'
              echo "### flutter --version"
              echo '```'
              flutter --version 2>&1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ---- 构建 macOS Release（工程为 ad-hoc 签名 "-"，无需证书）----
      - name: Build macOS Release
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build_macos.log"
          # Podfile.lock 在 macOS runner 上是 stale（基于本地手改的 Flutter 版本 / Xcode 版本生成），
          # flutter build 检测到 lock 已存在会跳过 pod install → Pods-Runner-frameworks-*.xcfilelist
          # 找不到，xcodebuild 报错。强制重装 pod 让 build 重新生成。
          # 注意：不要清 macos/Flutter/ephemeral（已由前面的 `flutter create` 生成），
          # 也不要清 Flutter-Release.xcconfig（否则 xcconfig 引用路径会先于 build 失效）。
          rm -rf macos/Pods macos/Podfile.lock
          if ! flutter build macos --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }} 2>&1 | tee "$LOG"; then
            # 失败时把日志尾部写进 job summary（匿名可读，便于无凭证排障）
            {
              echo "### macOS build failed (last 100 lines)"
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
              echo "### macos/Flutter/ contents"
              echo '```'
              ls -la macos/Flutter/ 2>&1 || true
              echo '```'
              echo "### macos/Pods/ contents"
              echo '```'
              ls macos/Pods/Target\ Support\ Files/ 2>&1 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ---- 打 DMG：经典“拖拽到 Applications”布局 + 使用说明 + 一键安装脚本 ----
      - name: Package DMG
        id: pack
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH="build/macos/Build/Products/Release/sw_cutter.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "构建产物不存在: $APP_PATH"
            exit 1
          fi
          codesign -dv "$APP_PATH" 2>&1 || true   # 打印签名信息，便于排查

          STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # ---- README.txt ----
          # 不含任何项目地址（避免指向源码仓库的元信息泄露）
          {
            echo "swCutter v${VERSION} (macOS, Apple Silicon)"
            echo
            echo "============================================================"
            echo "  安装"
            echo "============================================================"
            echo
            echo "  1) 把左侧的 sw_cutter 拖到右侧的 Applications 文件夹。"
            echo "  2) 安装完成。"
            echo
            echo "============================================================"
            echo "  首次打开会遇到 Gatekeeper 拦截（未做 Apple 公证）"
            echo "============================================================"
            echo
            echo "  macOS 默认会弹窗："
            echo "  “Apple无法验证“sw_cutter”是否包含可能危害Mac安全或"
            echo "   泄漏隐私的恶意软件。”"
            echo
            echo "  两种处理方式（任选其一）："
            echo
            echo "  方式 A：右键打开（最简单）"
            echo "    在 Finder 找到 sw_cutter.app → 右键 → 打开 → 弹窗里点"
            echo "    “打开”。只需一次，之后双击就能直接运行。"
            echo
            echo "  方式 B：双击 install.command（同样只需一次）"
            echo "    双击随包附带的 install.command，会弹终端问一次管理员密码"
            echo "    （用于清除隔离属性），完成后即可正常启动。"
            echo
            echo "  macOS 15+（Sequoia）如果右键 / install.command 都不管用："
            echo "    系统设置 → 隐私与安全性 → 拉到最下面 →"
            echo "    点“仍要打开” → 弹窗里再点“打开”。"
            echo
            echo "============================================================"
            echo "  后续更新"
            echo "============================================================"
            echo
            echo "  1) 退出旧版 sw_cutter。"
            echo "  2) 删 Applications 里的旧 sw_cutter.app。"
            echo "  3) 打开新版 dmg，照上面再走一次安装流程。"
            echo
            echo "============================================================"
            echo "  常见问题"
            echo "============================================================"
            echo
            echo "  Q: 提示“已损坏，无法打开”。"
            echo "  A: 在终端执行："
            echo "       xattr -cr /Applications/sw_cutter.app"
            echo "     或双击 install.command。"
            echo
            echo "  Q: 启动后立刻崩溃或窗口白屏。"
            echo "  A: 该 dmg 仅适用于 Apple Silicon (M1/M2/M3/M4) Mac。"
            echo "     Intel Mac 用户请取 x86_64 通用版。"
            echo
            echo "  Q: macOS 13 (Ventura) 及更早系统装不上。"
            echo "  A: 需要 macOS 10.14+；早期系统未测试。"
          } > "$STAGING/README.txt"

          # ---- install.command ----
          # 一键脚本：清除 xattr + 可选安装到 /Applications
          {
            echo "#!/usr/bin/env bash"
            echo "# swCutter 一键安装脚本（用户双击运行）"
            echo "# 作用："
            echo "#   1) 清除 .app 的隔离属性（解决“已损坏 / 无法验证”）"
            echo "#   2) 如果还没装到 /Applications，复制过去"
            echo "#   3) 启动 sw_cutter"
            echo
            echo "set -e"
            echo
            echo "APP_SRC=\"\${1:-}\""
            echo "if [[ -z \"\$APP_SRC\" ]]; then"
            echo "  # 默认定位：同目录的 sw_cutter.app（dmg 拖入 Applications 后的位置）"
            echo "  if [[ -d \"\$HOME/Applications/sw_cutter.app\" ]]; then"
            echo "    APP_SRC=\"\$HOME/Applications/sw_cutter.app\""
            echo "  elif [[ -d \"/Applications/sw_cutter.app\" ]]; then"
            echo "    APP_SRC=\"/Applications/sw_cutter.app\""
            echo "  elif [[ -d \"\$(dirname \"\${BASH_SOURCE[0]}\")/sw_cutter.app\" ]]; then"
            echo "    APP_SRC=\"\$(dirname \"\${BASH_SOURCE[0]}\")/sw_cutter.app\""
            echo "  fi"
            echo "fi"
            echo
            echo "if [[ -z \"\$APP_SRC\" || ! -d \"\$APP_SRC\" ]]; then"
            echo "  echo \"❌ 找不到 sw_cutter.app。请先把 sw_cutter 拖到 Applications 文件夹。\""
            echo "  echo \"   找不到？再跑一次这个脚本。\""
            echo "  read -p \"按回车关闭...\""
            echo "  exit 1"
            echo "fi"
            echo
            echo "echo \"==> 找到: \$APP_SRC\""
            echo
            echo "echo \"==> 清除隔离属性（需要管理员密码）...\""
            echo "sudo xattr -cr \"\$APP_SRC\""
            echo
            echo "echo \"==> 重新签名（ad-hoc，应用自身能跑就行）...\""
            echo "sudo codesign --force --deep --sign - \"\$APP_SRC\""
            echo
            echo "echo \"==> 启动 sw_cutter...\""
            echo "open \"\$APP_SRC\""
            echo
            echo "echo \"✅ 完成。可以关闭此窗口。\""
            echo "read -p \"按回车关闭...\""
          } > "$STAGING/install.command"
          chmod +x "$STAGING/install.command"

          DMG_NAME="sw_cutter-v${VERSION}-macos-arm64.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"
          rm -f "$DMG_PATH"
          hdiutil create \
            -volname "swCutter ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          ls -lh "$DMG_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sw_cutter-macos-arm64
          path: ${{ steps.pack.outputs.dmg_path }}
          if-no-files-found: error

  # ============================================================
  # [3] 汇总发布：等两个平台都构建成功，统一发 Release
  # ============================================================
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # 两个 artifact 的文件合并到同一目录

      - name: List artifacts
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}          # 显式指定 tag
          name: swCutter ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
