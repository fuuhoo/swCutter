[package]
name = "rust_lib_sw_cutter"
version = "0.1.0"
edition = "2021"

[lib]
# rlib 供集成测试链接；cdylib/staticlib 供 Flutter 打包
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
flutter_rust_bridge = "=2.13.0"
image = "0.25.10"
num_cpus = "1.17.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tiff = "0.11.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
